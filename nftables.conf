#!/usr/sbin/nft -f
# Best-effort LAN isolation for runner and container bridges.
# Bootstrap rewrites the dns_resolvers element line from the distro resolver.
# DNS accepts stay above the drops, so the resolver can sit in 127.0.0.0/8.
# This is not a Windows firewall. A job that can reconfigure its own netns,
# and the WSL2 virtual switch outside this distro, are outside this table.
# Bootstrap refuses networkingMode=mirrored because that switch would skip
# this table.

table inet aap_runner {
  set dns_resolvers {
    type ipv4_addr
    elements = { 127.0.0.53 }
  }

  set dns_resolvers6 {
    type ipv6_addr
  }

  chain input {
    type filter hook input priority -10; policy drop;
    iif "lo" accept
    ct state established,related accept
    icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
  }

  chain forward {
    type filter hook forward priority -10; policy drop;
    ct state established,related accept
    iifname { "docker0", "br-*", "sysbox*" } jump egress_from_runner
  }

  chain egress_from_runner {
    ip daddr @dns_resolvers udp dport 53 accept
    ip daddr @dns_resolvers tcp dport 53 accept
    ip6 daddr @dns_resolvers6 udp dport 53 accept
    ip6 daddr @dns_resolvers6 tcp dport 53 accept
    ip daddr 10.0.0.0/8 drop
    ip daddr 172.16.0.0/12 drop
    ip daddr 192.168.0.0/16 drop
    ip daddr 169.254.0.0/16 drop
    ip daddr 100.64.0.0/10 drop
    ip daddr 0.0.0.0/8 drop
    ip daddr 127.0.0.0/8 drop
    ip daddr 192.0.0.0/24 drop
    ip daddr 198.18.0.0/15 drop
    ip daddr 224.0.0.0/4 drop
    ip daddr 240.0.0.0/4 drop
    ip6 daddr fc00::/7 drop
    ip6 daddr fe80::/10 drop
    ip6 daddr ::ffff:0:0/96 drop
    ip6 daddr 64:ff9b::/96 drop
    ip6 daddr ff00::/8 drop
    accept
  }

  chain output {
    type filter hook output priority -10; policy accept;
  }
}
