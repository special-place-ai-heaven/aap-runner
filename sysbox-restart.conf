# Installed as restart.conf in sysbox.service.d, sysbox-mgr.service.d, and
# sysbox-fs.service.d, beside workdisk.conf, which keeps the work-disk
# Requires= and After=. A sysbox daemon that exits non-zero is restarted.
# No start limit: the host runs unattended, and RestartSec spaces retries.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5
