[package]
name = "aap-runner-tray"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tray-icon = "=0.26.1"

# Already in the tree through eframe (accesskit_windows); same features as Fathom's tray.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Compiles assets/aap-runner-tray.rc so the exe carries the R icon. Pinned like Fathom's.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.11"
