# Reference copy. The merged, manual (workflow_dispatch) version lives in .github/workflows of aap-runner;
# this copy is kept for reference only. Hosted runners only, then archive the log.
# No secrets, no third-party actions, no checkout, no token permissions.
# The label must be exactly `windows-2025-vs2026`. `windows-latest` and `windows-2025` are moving or
# ambiguous labels and must never be used as certification evidence (see ../hosted-reference.md).
name: hosted-reference-windows-2025-vs2026
on: workflow_dispatch
permissions: {}
jobs:
  capture:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Image identity (same data the Set up job > Runner Image group prints)
        run: |
          Get-Content -Raw C:\imagedata.json
          "ImageOS=$env:ImageOS"
          "ImageVersion=$env:ImageVersion"
          "RUNNER_OS=$env:RUNNER_OS RUNNER_ARCH=$env:RUNNER_ARCH RUNNER_ENVIRONMENT=$env:RUNNER_ENVIRONMENT"
          [System.Environment]::OSVersion.VersionString
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List | Out-String)

      - name: Hardware class
        run: |
          $cpu = Get-CimInstance Win32_Processor
          "logical_processors=" + ($cpu | Measure-Object NumberOfLogicalProcessors -Sum).Sum
          "total_ram_bytes=" + (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table | Out-String

      - name: User, privileges, UAC
        run: |
          whoami
          $p = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          "is_administrator=" + $p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "ConsentPromptBehaviorAdmin=" + (Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System).ConsentPromptBehaviorAdmin
          Get-ExecutionPolicy -List | Out-String

      - name: Allow-listed environment (names fixed here; never dump the full environment)
        run: |
          $names = 'ImageOS','ImageVersion','AGENT_TOOLSDIRECTORY','RUNNER_TOOL_CACHE','ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE',
                   'JAVA_HOME','JAVA_HOME_17_X64','GOROOT_1_24_X64','VCPKG_INSTALLATION_ROOT','CONDA','ANDROID_HOME','ANDROID_NDK_HOME',
                   'CHROMEWEBDRIVER','EDGEWEBDRIVER','GECKOWEBDRIVER','SELENIUM_JAR_PATH','DOTNET_MULTILEVEL_LOOKUP','DOTNET_NOLOGO',
                   'DOTNET_SKIP_FIRST_TIME_EXPERIENCE','POWERSHELL_UPDATECHECK','GCM_INTERACTIVE','PIPX_BIN_DIR','PIPX_HOME',
                   'PGBIN','PGROOT','PGDATA','PGUSER','VCINSTALLDIR','VSINSTALLDIR','VSCMD_VER','INCLUDE','LIB','LIBPATH','Platform'
          foreach ($n in $names) { $v = [Environment]::GetEnvironmentVariable($n); if ($null -ne $v) { "$n=$v" } else { "$n=<unset>" } }
          # Credential-bearing variables: record presence only, never the value.
          'PGPASSWORD' | ForEach-Object { "$_ present=" + ($null -ne [Environment]::GetEnvironmentVariable($_)) }

      - name: PATH order (job process) and machine PATH order
        run: |
          "--- process PATH"; $env:PATH -split ';' | ForEach-Object -Begin { $i = 0 } -Process { '{0:D3} {1}' -f $i++, $_ }
          "--- machine PATH"; [Environment]::GetEnvironmentVariable('PATH','Machine') -split ';' | ForEach-Object -Begin { $i = 0 } -Process { '{0:D3} {1}' -f $i++, $_ }

      - name: Shells and versions
        run: |
          $PSVersionTable.PSVersion.ToString()
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          bash --version | Select-Object -First 1
          Get-ChildItem C:\shells | Select-Object Name, Target | Format-Table | Out-String
          Get-Content "$PSHOME\..\..\WindowsPowerShell\v1.0\profile.ps1" -ErrorAction SilentlyContinue

      - name: Visual Studio without developer environment
        run: |
          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vsw -latest -products * -format json | Out-String
          Get-Command cl.exe, link.exe, clang-cl.exe, cmake.exe, ninja.exe, msbuild.exe -ErrorAction SilentlyContinue | Select-Object Name, Source | Format-Table | Out-String

      - name: Services of interest
        run: |
          'wuauserv','DiagTrack','SysMain','docker','postgresql-x64-17','MongoDB','Apache','nginx','wlansvc','WinDefend','WSLService' |
            ForEach-Object { Get-Service -Name $_ -ErrorAction SilentlyContinue } | Select-Object Name, Status, StartType | Format-Table | Out-String

      - name: Docker state (no cached images are expected on Windows Server 2025)
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}'

      - name: Tool cache layout
        run: |
          Get-ChildItem $env:AGENT_TOOLSDIRECTORY -Directory | ForEach-Object {
            $t = $_.Name; Get-ChildItem $_.FullName -Directory | ForEach-Object { "$t/$($_.Name)" } }
