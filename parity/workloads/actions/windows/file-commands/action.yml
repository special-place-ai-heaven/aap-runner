name: aap parity file commands (windows)
description: >-
  Step-to-step Actions behaviour on Windows: GITHUB_ENV (single and multiline), GITHUB_PATH, GITHUB_OUTPUT and
  GITHUB_STEP_SUMMARY written from pwsh, powershell, cmd and bash steps, working-directory, and exit-code
  propagation of a successful step. The last step verifies everything and writes
  $RUNNER_TEMP/aap-parity-file-commands.json, which the workload actions/windows/file-commands checks.
  Use it in the same job before parity/workloads/windows/Invoke-Workloads.ps1.
outputs:
  value:
    description: The value the powershell step wrote to GITHUB_OUTPUT.
    value: ${{ steps.out.outputs.value }}
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        "PARITY_FROM_PWSH=pwsh-ok" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        $bin = Join-Path $env:RUNNER_TEMP 'aap-parity-fc-bin'
        New-Item -ItemType Directory -Force -Path $bin | Out-Null
        Set-Content -Path (Join-Path $bin 'aap-parity-fc-tool.cmd') -Value '@echo parity-path-ok' -Encoding ascii
        $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
    - shell: cmd
      run: echo PARITY_FROM_CMD=cmd-ok>>"%GITHUB_ENV%"
    - shell: bash
      run: |
        echo "PARITY_FROM_BASH=bash-ok" >> "$GITHUB_ENV"
        {
          echo 'PARITY_MULTI<<AAP_PARITY_EOF'
          echo 'line1'
          echo 'line2'
          echo 'AAP_PARITY_EOF'
        } >> "$GITHUB_ENV"
    - id: out
      shell: powershell
      run: |
        "value=out-ok" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "### aap parity file commands" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
    - shell: pwsh
      working-directory: ${{ runner.temp }}
      env:
        PARITY_STEP_OUTPUT: ${{ steps.out.outputs.value }}
      run: |
        # each step has its own GITHUB_STEP_SUMMARY file; the earlier step's append failing would have failed that step
        "aap parity file commands verified" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        $summaryOk = $?
        $checks = [ordered]@{
          env_pwsh      = $env:PARITY_FROM_PWSH -eq 'pwsh-ok'
          env_cmd       = $env:PARITY_FROM_CMD -eq 'cmd-ok'
          env_bash      = $env:PARITY_FROM_BASH -eq 'bash-ok'
          env_multiline = ("$env:PARITY_MULTI" -replace "`r", '') -eq "line1`nline2"
          path          = ((& aap-parity-fc-tool.cmd) -join '') -eq 'parity-path-ok'
          output        = $env:PARITY_STEP_OUTPUT -eq 'out-ok'
          summary       = $summaryOk
          working_dir   = (Get-Location).Path.TrimEnd('\') -eq $env:RUNNER_TEMP.TrimEnd('\')
        }
        $doc = [ordered]@{ run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; checks = $checks }
        $doc | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'aap-parity-file-commands.json')
        $checks.GetEnumerator() | ForEach-Object { '{0,-14} {1}' -f $_.Key, $_.Value }
        if ($checks.Values -contains $false) { Write-Error 'aap parity file commands: a check failed' }
