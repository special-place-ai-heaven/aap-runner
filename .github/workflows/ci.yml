name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Dogfood: pushes to main, manual runs and pull requests from branches in this repository run on the
# owner's own runners (the Linux pool and the interim Windows runner). Pull requests from forks are
# untrusted code and always run on GitHub-hosted runners (CLAUDE.md: never run untrusted PR code on
# the self-hosted runners).

jobs:
  bash:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","fresh"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash distro/bootstrap.sh --self-check
      - run: bash distro/manager.sh --self-check
      - run: bash tests/run.sh
      - run: python3 -B -I -m unittest discover -s tests/parity/cache/qualification -p "test_*.py"
      - run: python3 -B -I parity/contracts/validate.py
      - run: python3 -B -I tests/parity/workloads/linux/test_workloads.py
      - run: python3 -B -I tests/parity/workloads/linux/check_hosted_run.py .
      - run: bash tests/parity/workloads/linux/lib_test.sh
      - run: bash tests/parity/cache/qualification/harness_test.sh
      - run: bash tests/guests/cache/zccache_test.sh
      - run: bash tests/images/ubuntu-24.04/guest_test.sh
      - run: bash tests/guests/linux/agent_test.sh
      - run: python3 -B -I -m unittest discover -s tests/guests/cache -p "test_*.py"
      # Pinned: the hosted image's shellcheck is a different version from the 0.11.0 the repo rule names
      # (it flags SC2218 in tests/manager_reap_test.sh). The sha256 is the GitHub release asset digest
      # and equals the sha256 of the tarball checked locally.
      - name: install shellcheck 0.11.0
        run: |
          set -euo pipefail
          url=https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl --fail --location --proto =https --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/shellcheck.tar.xz" "$url"
          echo "$sha  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
      - run: $RUNNER_TEMP/shellcheck-v0.11.0/shellcheck -S warning distro/*.sh tests/*.sh tests/parity/cache/qualification/*.sh parity/cache/qualification/harness/*.sh tools/parity-certify/probe/linux.sh parity/workloads/linux/*.sh parity/workloads/linux/*/*.sh parity/workloads/actions/linux/*/*.sh parity/workloads/xwin/*.sh tests/parity/workloads/linux/*.sh guests/cache/linux/*.sh tests/guests/cache/zccache_test.sh tests/guests/cache/fakes/fake-cc tests/guests/cache/fakes/fake-zccache images/ubuntu-24.04/guest/*.sh tests/images/ubuntu-24.04/*.sh guests/linux/*.sh tests/guests/linux/*.sh

  pester:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","windows-host-interim"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/install-host.Tests.ps1
      - shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = @('supervisor', 'tests/parity-work', 'tests/capacity', 'tests/broker', 'tests/images/common', 'tests/parity-certify', 'tests/network', 'tests/common')
          $c.Filter.ExcludeTag = @('Network')
          $c.Run.Exit = $true
          Invoke-Pester -Configuration $c

  pester-backends:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","windows-host-interim"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = @('tests/backends/windows', 'tests/backends/linux', 'tests/guests/cache', 'tests/images/windows', 'tests/parity/workloads/windows', 'tests/images/ubuntu-24.04', 'tests/guests/windows')
          $c.Filter.ExcludeTag = @('Network')
          $c.Run.Exit = $true
          Invoke-Pester -Configuration $c

  # crates/pool-core is also covered workspace-wide by the tray job on Windows. This job runs it on
  # Linux, where the code will run, and proves the static musl build the distro will ship.
  pool-core:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","fresh"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo fmt --all --check
      - run: cargo clippy -p aap-pool-core --all-targets --locked -- -D warnings
      - run: cargo test -p aap-pool-core --locked
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build -p aap-pool-core --bin aap-pool --release --locked --target x86_64-unknown-linux-musl
      - name: aap-pool is a static binary and runs
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/aap-pool
          info=$(file "$bin")
          echo "$info"
          grep -Eq 'statically linked|static-pie linked' <<< "$info"
          if grep -q 'dynamically linked' <<< "$info"; then exit 1; fi
          test "$("$bin" limits --runners 2 --sharing fixed | tr '\n' ' ')" = '--memory 6g --memory-swap 6g --cpus 3 --cpu-shares 512 --pids-limit 4096 '
          if "$bin" limits --runners 6 2> "$RUNNER_TEMP/err"; then exit 1; else test $? -eq 2; fi
          test "$(wc -l < "$RUNNER_TEMP/err")" -eq 1

  tray:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","windows-host-interim"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
