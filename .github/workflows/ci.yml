name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash distro/bootstrap.sh --self-check
      - run: bash distro/manager.sh --self-check
      - run: bash tests/run.sh
      - run: python3 -B -I -m unittest discover -s tests/parity/cache/qualification -p "test_*.py"
      - run: python3 -B -I parity/contracts/validate.py
      - run: python3 -B -I tests/parity/workloads/linux/test_workloads.py
      - run: python3 -B -I tests/parity/workloads/linux/check_hosted_run.py .
      - run: bash tests/parity/workloads/linux/lib_test.sh
      - run: bash tests/parity/cache/qualification/harness_test.sh
      - run: bash tests/guests/cache/zccache_test.sh
      - run: python3 -B -I -m unittest discover -s tests/guests/cache -p "test_*.py"
      # Pinned: the hosted image's shellcheck is a different version from the 0.11.0 the repo rule names
      # (it flags SC2218 in tests/manager_reap_test.sh). The sha256 is the GitHub release asset digest
      # and equals the sha256 of the tarball checked locally.
      - name: install shellcheck 0.11.0
        run: |
          set -euo pipefail
          url=https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl --fail --location --proto =https --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/shellcheck.tar.xz" "$url"
          echo "$sha  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
      - run: $RUNNER_TEMP/shellcheck-v0.11.0/shellcheck -S warning distro/*.sh tests/*.sh tests/parity/cache/qualification/*.sh parity/cache/qualification/harness/*.sh tools/parity-certify/probe/linux.sh parity/workloads/linux/*.sh parity/workloads/linux/*/*.sh parity/workloads/actions/linux/*/*.sh parity/workloads/xwin/*.sh tests/parity/workloads/linux/*.sh guests/cache/linux/*.sh tests/guests/cache/zccache_test.sh tests/guests/cache/fakes/fake-cc tests/guests/cache/fakes/fake-zccache

  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/install-host.Tests.ps1
      - shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = @('supervisor', 'tests/parity-work', 'tests/capacity', 'tests/broker', 'tests/images/common', 'tests/parity-certify', 'tests/network', 'tests/common')
          $c.Filter.ExcludeTag = @('Network')
          $c.Run.Exit = $true
          Invoke-Pester -Configuration $c

  pester-backends:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = @('tests/backends/windows', 'tests/guests/cache', 'tests/images/windows', 'tests/parity/workloads/windows')
          $c.Filter.ExcludeTag = @('Network')
          $c.Run.Exit = $true
          Invoke-Pester -Configuration $c

  tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
