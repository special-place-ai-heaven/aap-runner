name: windows-thin-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, windows, x64]
    steps:
      - shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          [System.Environment]::OSVersion.VersionString
          git --version
          whoami
